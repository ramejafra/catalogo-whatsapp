<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>Abarrotes Doña Mary · Pedidos por WhatsApp</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="demo tienda" data-demo="tienda">

  <!-- Header pegajoso -->
  <header class="biz-header">
    <div class="biz-header-inner">
      <a href="index.html" class="biz-back" aria-label="Volver">←</a>
      <div class="biz-info">
        <div class="biz-emoji" data-business-emoji>🛒</div>
        <div>
          <h1 data-business-name>Abarrotes</h1>
          <p data-business-tagline>—</p>
        </div>
      </div>
      <div class="biz-meta">
        <div>📍 <strong data-business-address>—</strong></div>
        <div>🕐 <strong data-business-hours>—</strong></div>
        <div>📱 <strong data-business-phone>—</strong></div>
      </div>
    </div>
  </header>

  <!-- Banner promo -->
  <section class="biz-promo">
    <div class="biz-promo-inner">
      <h2>Compra del súper sin salir de casa 🛒🏠</h2>
      <p>Agrega productos al carrito y te los llevamos a tu puerta. ¡Envío gratis sobre $500!</p>
    </div>
  </section>

  <!-- Categorías -->
  <div class="categories-wrap">
    <nav class="categories" data-categories></nav>
  </div>

  <!-- Productos -->
  <main class="products" data-products></main>

  <!-- Botón flotante del carrito -->
  <button class="cart-fab" data-cart-fab aria-label="Ver pedido">
    <span>🛒 Ver pedido</span>
    <span class="fab-count" data-cart-count>0</span>
    <span class="fab-total" data-cart-fab-total>$0</span>
  </button>

  <!-- Overlay -->
  <div class="overlay" data-overlay></div>

  <!-- Panel del carrito -->
  <aside class="panel cart-panel" data-cart-panel aria-label="Tu pedido">
    <div class="panel-head">
      <h2>Tu pedido 🛒</h2>
      <button class="panel-close" data-close-cart aria-label="Cerrar">×</button>
    </div>
    <div class="panel-body" data-cart-items></div>
    <div class="panel-foot">
      <div class="cart-total">
        <span>Subtotal</span>
        <strong data-cart-total>$0</strong>
      </div>
      <div data-delivery-info style="margin-bottom: 14px;"></div>
      <button class="action-btn" data-checkout-btn disabled>
        Continuar al pedido →
      </button>
    </div>
  </aside>

  <!-- Panel de checkout -->
  <aside class="panel checkout-panel" data-checkout-panel aria-label="Datos del pedido">
    <div class="panel-head">
      <h2>Datos del pedido</h2>
      <button class="panel-close" data-close-checkout aria-label="Cerrar">×</button>
    </div>
    <div class="panel-body">
      <div class="field">
        <label for="name">Nombre *</label>
        <input id="name" data-name type="text" placeholder="Tu nombre" required>
      </div>
      <div class="field">
        <label for="phone">Teléfono</label>
        <input id="phone" data-phone type="tel" placeholder="55 1234 5678">
      </div>

      <fieldset class="fieldset">
        <legend class="fieldset-label">Modalidad de entrega</legend>
        <div class="radio-row">
          <label class="radio-pill">
            <input type="radio" name="mode" data-mode value="pickup" checked>
            🏪 Recoger
          </label>
          <label class="radio-pill">
            <input type="radio" name="mode" data-mode value="delivery">
            🛵 A domicilio
          </label>
        </div>
      </fieldset>

      <div class="field">
        <label for="address">Dirección (solo a domicilio)</label>
        <input id="address" data-address type="text" placeholder="Calle, número, colonia…">
      </div>

      <fieldset class="fieldset">
        <legend class="fieldset-label">Forma de pago</legend>
        <div class="radio-row">
          <label class="radio-pill">
            <input type="radio" name="payment" data-payment value="cash" checked>
            💵 Efectivo
          </label>
          <label class="radio-pill">
            <input type="radio" name="payment" data-payment value="transfer">
            📲 Transferencia
          </label>
          <label class="radio-pill">
            <input type="radio" name="payment" data-payment value="card">
            💳 Tarjeta
          </label>
        </div>
      </fieldset>

      <div class="field">
        <label for="notes">Notas para el pedido</label>
        <textarea id="notes" data-notes placeholder="Marca de preferencia, instrucciones, etc."></textarea>
      </div>
    </div>
    <div class="panel-foot">
      <div class="cart-total" style="margin-bottom: 14px;">
        <span>Total</span>
        <strong data-cart-total>$0</strong>
      </div>
      <button class="action-btn" data-place-order>
        💬 Enviar pedido por WhatsApp
      </button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
